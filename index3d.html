
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BattleZone India 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial;color:#fff;touch-action:none}
#game{display:block;width:100%;height:100%}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#10202dcc;padding:8px 11px;border-radius:10px;font-weight:bold;font-size:13px}
#help{position:fixed;top:52px;left:10px;background:#10202dbb;padding:6px 9px;border-radius:8px;font-size:11px}
#joy{position:fixed;left:20px;bottom:22px;width:120px;height:120px;border:2px solid #ffffff99;border-radius:50%;background:#ffffff22;display:grid;place-items:center}
#stick{width:48px;height:48px;border-radius:50%;background:#ffffffbb}
#fire{position:fixed;right:24px;bottom:38px;width:76px;height:76px;border:0;border-radius:50%;background:#df4938;color:#fff;font-weight:bold;font-size:15px}
#overlay{position:fixed;inset:0;background:#07121dcc;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}
#panel{max-width:340px;background:#172b3b;padding:24px;border-radius:16px}
#start{background:#f1b52c;border:0;border-radius:9px;padding:12px 24px;font-weight:bold}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="pill">🇮🇳 BATTLEZONE INDIA 3D</div>
 <div class="pill" id="health">HEALTH: 100</div>
 <div class="pill" id="kills">KILLS: 0</div>
</div>
<div id="help">मोबाइल: Joystick से चलें • FIRE से शूट करें<br>कंप्यूटर: WASD / Arrow Keys • Space: Fire</div>
<div id="joy"><div id="stick"></div></div>
<button id="fire">FIRE</button>
<div id="overlay"><div id="panel"><h2>BattleZone India 3D</h2><p>Third-person 3D survival prototype</p><p>दुश्मनों से बचें और उन्हें शूट करें।</p><button id="start">START GAME</button></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9e8);
scene.fog=new THREE.Fog(0x91c9e8,35,105);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const hemi=new THREE.HemisphereLight(0xffffff,0x58704b,2.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.set(20,35,15);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x668d4d}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(180,60,0x496b3c,0x78945d);grid.position.y=.015;scene.add(grid);

function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function tree(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,2,8),new THREE.MeshStandardMaterial({color:0x76502e}));
 trunk.position.set(x,1,z);trunk.castShadow=true;scene.add(trunk);
 const leaves=new THREE.Mesh(new THREE.SphereGeometry(1.15,10,8),new THREE.MeshStandardMaterial({color:0x28643a}));
 leaves.position.set(x,2.65,z);leaves.castShadow=true;scene.add(leaves);
}
for(let i=0;i<34;i++){
 const x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;
 if(Math.hypot(x,z)>13)tree(x,z);
}
for(let i=0;i<9;i++){
 const x=(Math.random()-.5)*65,z=(Math.random()-.5)*65;
 if(Math.hypot(x,z)>15){
  box(5,3.2,5,0xc5a16b,x,1.6,z);
  box(5.8,.45,5.8,0x743e2d,x,3.45,z);
 }
}

function makeSoldier(color=0x294e70){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.15,.45),new THREE.MeshStandardMaterial({color}));
 body.position.y=1.25;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,14,12),new THREE.MeshStandardMaterial({color:0xd5a27e}));
 head.position.y=2.05;head.castShadow=true;g.add(head);
 const pack=new THREE.Mesh(new THREE.BoxGeometry(.48,.72,.25),new THREE.MeshStandardMaterial({color:0x394b32}));
 pack.position.set(0,1.35,-.34);g.add(pack);
 const gun=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,1.05),new THREE.MeshStandardMaterial({color:0x20252a}));
 gun.position.set(.42,1.48,.48);g.add(gun);
 return g;
}
const player=makeSoldier();scene.add(player);player.position.set(0,0,0);
const enemies=[];
function spawnEnemy(){
 const a=Math.random()*Math.PI*2,r=17+Math.random()*18;
 const e=makeSoldier(0x8d3430);e.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
 e.userData.hp=2;e.userData.speed=1.15+Math.random()*.45;scene.add(e);enemies.push(e);
}
for(let i=0;i<5;i++)spawnEnemy();

const bullets=[];
function shoot(){
 if(!running)return;
 const origin=player.position.clone();origin.y+=1.45;
 const direction=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)).normalize();
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0xffdf69}));
 mesh.position.copy(origin).add(direction.clone().multiplyScalar(1.1));scene.add(mesh);
 bullets.push({mesh,dir:direction,life:1.5});
}
let health=100,kills=0,running=false,lastShot=0;
const healthEl=document.querySelector('#health'),killsEl=document.querySelector('#kills');
function hud(){healthEl.textContent='HEALTH: '+Math.max(0,Math.ceil(health));killsEl.textContent='KILLS: '+kills;}
function gameOver(){
 running=false;
 document.querySelector('#overlay').style.display='flex';
 document.querySelector('#panel h2').textContent='GAME OVER';
 document.querySelector('#panel p').textContent='आपके Kills: '+kills;
 document.querySelector('#start').textContent='RESTART';
}
function fire(){
 const now=performance.now();
 if(now-lastShot>350){lastShot=now;shoot();}
}
document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();fire();});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')fire();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const keys={};

const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');
let jx=0,jy=0,joyOn=false;
function moveJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43;
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 jx=dx/max;jy=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener('pointerdown',e=>{joyOn=true;joy.setPointerCapture(e.pointerId);moveJoy(e);});
joy.addEventListener('pointermove',e=>{if(joyOn)moveJoy(e);});
function stopJoy(){joyOn=false;jx=jy=0;stick.style.transform='translate(0,0)';}
joy.addEventListener('pointerup',stopJoy);
joy.addEventListener('pointercancel',stopJoy);

document.querySelector('#start').onclick=()=>{
 health=100;kills=0;hud();running=true;
 document.querySelector('#overlay').style.display='none';
 player.position.set(0,0,0);player.rotation.y=0;
};
function update(dt){
 let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jx;
 let z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jy;
 const len=Math.hypot(x,z);if(len>1){x/=len;z/=len;}
 if(Math.abs(x)+Math.abs(z)>.05){
  player.position.x+=x*5*dt;player.position.z+=z*5*dt;
  player.rotation.y=Math.atan2(x,z);
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-75,75);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-75,75);
 const targetCam=new THREE.Vector3(player.position.x-Math.sin(player.rotation.y)*7,5.2,player.position.z-Math.cos(player.rotation.y)*7);
 camera.position.lerp(targetCam,.12);
 camera.lookAt(player.position.x,1.2,player.position.z+1.5);

 for(const e of enemies){
  const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz)||1;
  if(d>1.5){
   e.position.x+=dx/d*e.userData.speed*dt;
   e.position.z+=dz/d*e.userData.speed*dt;
   e.rotation.y=Math.atan2(dx,dz);
  }
  if(d<1.7)health-=9*dt;
 }
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.mesh.position.addScaledVector(b.dir,22*dt);b.life-=dt;
  let hit=false;
  for(let j=enemies.length-1;j>=0;j--){
   const e=enemies[j];
   if(b.mesh.position.distanceTo(new THREE.Vector3(e.position.x,e.position.y+1.3,e.position.z))<1.05){
    e.userData.hp--;hit=true;
    if(e.userData.hp<=0){
     scene.remove(e);enemies.splice(j,1);kills++;
     if(enemies.length<7)spawnEnemy();
    }
    break;
   }
  }
  if(hit||b.life<=0){scene.remove(b.mesh);bullets.splice(i,1);}
 }
 hud();if(health<=0)gameOver();
}
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(running)update(dt);
 renderer.render(scene,camera);
}
camera.position.set(0,5,-7);camera.lookAt(0,1,0);animate();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
